<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campos Harmônicos - Violão, Baixo e Teclado</title>
<style>
  /* ============================================================
     VISUAL DA PÁGINA
     Aqui fica só a aparência: cores, tamanhos e posições.
     ============================================================ */

  /* Fundo escuro e letra clara em toda a página */
  body {
    background: #1a1a1a;
    color: #eee;
    font-family: Arial, Helvetica, sans-serif;
    padding: 16px 20px 20px;
    margin: 0;
    overflow-x: auto;
  }

  /* Caixa grande que segura tudo. Tem largura mínima pra nada ficar espremido */
  .quadro {
    min-width: 1100px;
  }
  /* Parte de cima: escolhas, título e o instrumento */
  .linha-topo {
    padding-bottom: 14px;
    border-bottom: 1px solid #333;
    margin-bottom: 20px;
  }
  /* Parte de baixo: os acordes */
  .linha-baixo {
    margin-top: 6px;
  }

  /* ---------- Faixa das escolhas (instrumento, campo, tipo) ---------- */
  .controles {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 10px;
    margin-bottom: 10px;
  }
  .controles label,
  .controles .rotulo-campo {
    color: #ffcc66;
    font-size: 13px;
    font-weight: bold;
  }
  .controles label:not(:first-child),
  .controles .rotulo-campo {
    margin-left: 14px;
  }
  /* Caixinhas de escolher (instrumento e tipo) */
  select {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 6px 28px 6px 10px;
    font-size: 14px;
    cursor: pointer;
  }
  select:hover {
    background: #3a3a3a;
  }
  select:focus-visible {
    outline: 2px solid #66ccff;
    outline-offset: 2px;
  }
  select option {
    background: #2a2a2a;
    color: #eee;
  }

  /* ---------- Botões dos campos (C, C#, Db, D...) ---------- */
  .botoes-campo {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
  }
  .botao-campo {
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 6px 8px;
    min-width: 34px;
    font-size: 14px;
    cursor: pointer;
  }
  .botao-campo:hover {
    background: #3a3a3a;
  }
  .botao-campo:focus-visible {
    outline: 2px solid #66ccff;
    outline-offset: 2px;
  }
  .botao-campo[aria-pressed="true"] {
    background: #fff;
    color: #1a1a1a;
    border-color: #fff;
    font-weight: bold;
  }
  /* Dois botões colados: o de sustenido e o de bemol (mesmo som) */
  .par-campo {
    display: flex;
    border: 1px solid #555;
    border-radius: 6px;
    overflow: hidden;
  }
  .par-campo .botao-campo {
    border: none;
    border-radius: 0;
  }
  .par-campo .botao-campo + .botao-campo {
    border-left: 1px solid #555;
  }

  /* ---------- Barra dos acordes (versão simples, depois vira tabela) ---------- */
  .barra-acordes {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 14px;
  }
  .barra-acordes .rotulo-barra {
    color: #ffcc66;
    font-size: 13px;
    font-weight: bold;
    margin-right: 8px;
  }
  /* Botão grande de cada acorde (I, II, III...) */
  .botao-acorde {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    box-sizing: border-box;
    width: 100%;
    min-width: 0;
    min-height: 40px;
    line-height: 1.25;
    text-align: center;
    overflow-wrap: anywhere;
    background: #2a2a2a;
    color: #eee;
    border: 1px solid #555;
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 14px;
    cursor: pointer;
  }
  /* A faixa colorida embaixo do botão (cada acorde tem a sua cor) */
  .botao-acorde { border-bottom: 5px solid var(--cor, #555); }
  .botao-acorde:hover {
    background: #3a3a3a;
  }
  .botao-acorde:focus-visible {
    outline: 2px solid #66ccff;
    outline-offset: 2px;
  }
  /* O número romano do acorde (I, IV, V...) */
  .botao-acorde .grau {
    color: #ffcc66;
    font-size: 12px;
    font-weight: bold;
  }
  .botao-acorde .nome-acorde {
    font-weight: bold;
  }
  /* Quando o acorde está ligado, o botão fica branco */
  .botao-acorde[aria-pressed="true"] {
    background: #fff;
    color: #1a1a1a;
    border-bottom: 5px solid var(--cor, #555);
    box-shadow: inset 0 0 0 2px var(--cor, #555);
  }
  .botao-acorde[aria-pressed="true"] .grau {
    color: #555;
  }

  /* Botão "Modo acordes" */
  .botao-modo {
    margin-left: 14px;
    background: #2a2a2a; color: #eee; border: 1px solid #555; border-radius: 6px;
    padding: 6px 12px; font-size: 14px; cursor: pointer;
  }
  .botao-modo:hover { background: #3a3a3a; }
  .botao-modo[aria-pressed="true"] { background: #fff; color: #1a1a1a; border-color: #fff; font-weight: bold; }
  .botao-modo:focus-visible { outline: 2px solid #66ccff; outline-offset: 2px; }
  .barra-acordes[hidden] { display: none; }
  .linha-baixo { position: relative; }

  /* ---------- Chave "Acorde Completo" (canto esquerdo) ---------- */
  .caixa-chave-completo { position: absolute; left: 0; top: 0; display: flex; align-items: center; padding-top: 2px; }
  .chave-completo { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; color: #ffcc66; font-size: 13px; font-weight: bold; user-select: none; }
  .chave-completo span { display: flex; flex-direction: column; align-items: center; text-align: center; line-height: 1.15; }
  .chave-completo input[type="checkbox"] {
    appearance: none; -webkit-appearance: none; width: 38px; height: 20px; border-radius: 999px;
    background: #444; border: 1px solid #666; position: relative; cursor: pointer; outline: none; flex: none;
  }
  /* A bolinha que anda de um lado pro outro */
  .chave-completo input[type="checkbox"]::before {
    content: ""; position: absolute; top: 1px; left: 1px; width: 16px; height: 16px; border-radius: 50%;
    background: #ccc; transition: left 0.15s ease, background 0.15s ease;
  }
  .chave-completo input[type="checkbox"]:checked { background: #2a8fa0; border-color: #2a8fa0; }
  .chave-completo input[type="checkbox"]:checked::before { left: 19px; background: #fff; }
  .chave-completo input[type="checkbox"]:focus-visible { outline: 2px solid #66ccff; outline-offset: 2px; }

  /* ---------- Barra dos acordes (versão final: 7 colunas lado a lado) ---------- */
  .barra-acordes {
    display: grid;
    grid-template-columns: repeat(7, minmax(128px, 1fr));
    grid-template-rows: auto auto auto auto auto auto;
    column-gap: clamp(12px, 2.2vw, 28px);
    row-gap: 8px;
    align-items: start;
    min-height: 196px;
    justify-content: center;
    max-width: 1100px;
    margin: 0 auto;
  }
  /* Cada coluna é um acorde, com uma linha vermelha separando da vizinha */
  .coluna-acorde { display: grid; grid-template-rows: subgrid; grid-row: 1 / span 6; min-width: 0; padding-left: 12px; border-left: 2px solid #c0392b; }
  .coluna-acorde:first-child { padding-left: 0; border-left: none; }
  /* Dois botões lado a lado (< > e − +) */
  .setas { display: flex; gap: 8px; }
  /* Acorde desligado fica apagadinho e não deixa clicar nas coisas dele */
  .coluna-acorde-inativa { opacity: 0.4; }
  .coluna-acorde-inativa .botao-ouvir,
  .coluna-acorde-inativa .extensao input,
  .coluna-acorde-inativa .extensao button,
  .coluna-acorde-inativa .variacoes input { pointer-events: none; cursor: default; }

  /* ---------- Extensões (3ª, 5ª, 7ª, 9ª, 11ª, 13ª) ---------- */
  .caixa-extensoes { min-width: 0; }
  .marcadores-extensoes { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px 2px; font-size: 12px; color: #ddd; }
  .extensao { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; }
  .extensao input { margin: 0; cursor: pointer; accent-color: #ffcc66; }
  .extensao input:disabled { cursor: default; opacity: 0.35; }
  .extensao button {
    background: none; border: none; color: #ddd; font-size: 11.5px; padding: 1px 0; min-width: 0;
    cursor: pointer; border-radius: 4px; white-space: nowrap;
  }
  /* Amarelo = a pessoa trocou o jeito normal da nota */
  .extensao button.alterada { color: #ffcc66; font-weight: bold; }
  /* Contorno azul = é essa extensão que está sendo mexida agora */
  .extensao button.foco { background: #333; outline: 1px solid #66ccff; }
  .extensao button:disabled { opacity: .35; cursor: default; }
  /* Caixinha com as escolhas da extensão (ex.: b9, 9, #9) */
  .variacoes {
    display: flex; gap: 3px; margin-top: 6px; min-height: 34px;
    background: #222; border: 1px solid #444; border-radius: 6px; padding: 4px;
    justify-content: center; align-items: center; box-sizing: border-box;
  }
  .variacoes[hidden] { visibility: hidden; display: flex; }
  .variacoes label {
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 10px; color: #aaa; cursor: pointer; flex: 1; min-width: 0;
  }
  .variacoes input { margin: 0; cursor: pointer; accent-color: #ffcc66; }
  /* A escolha normal (do campo) ganha um pontinho azul */
  .variacoes .natural input { width: 14px; height: 14px; position: relative; }
  .variacoes .natural input::after {
    content: ""; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 6px; height: 6px; border-radius: 50%; background: #66ccff;
  }
  /* Textinho de ajuda embaixo */
  .legenda { color: #888; font-size: 11px; text-align: center; margin: 12px auto 0; max-width: 760px; }
  /* Nome da inversão (Fundamental, 1ª inversão...) */
  .rotulo-inversao { text-align: center; font-size: 11px; color: #66ccff; }
  /* Botões pequenos de < > e − + */
  .botao-seta {
    flex: 1; background: #2a2a2a; color: #eee; border: 1px solid #555; border-radius: 6px;
    padding: 2px 0; font-size: 14px; font-weight: bold; cursor: pointer;
  }
  .botao-seta:hover:not(:disabled) { background: #3a3a3a; }
  .botao-seta:disabled { opacity: 0.3; cursor: default; }
  .botao-seta:focus-visible { outline: 2px solid #66ccff; outline-offset: 2px; }
  /* Botão "Ouvir" */
  .botao-ouvir {
    background: #2a2a2a; color: #66ccff; border: 1px solid #555; border-radius: 6px;
    padding: 3px 0; font-size: 12px; font-weight: bold; cursor: pointer; width: 100%;
  }
  .botao-ouvir:hover { background: #3a3a3a; }
  .botao-ouvir:focus-visible { outline: 2px solid #66ccff; outline-offset: 2px; }

  /* ---------- Título e linha com as notas do campo ---------- */
  .linha-info {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 18px;
    margin: 0;
  }
  #info-campo {
    font-size: 15px;
    color: #66ccff;
    line-height: 1.4;
    text-align: right;
    min-width: 0;
  }
  #info-campo .info-acorde { white-space: nowrap; }
  #info-campo .separador { margin: 0 24px; }
  h1 { white-space: nowrap; }

  /* Espaço fixo onde aparece o braço ou o teclado */
  .palco { height: 318px; }

  /* ---------- Braço do violão e do baixo (tabela) ---------- */
  table {
    border-collapse: collapse;
    width: 100%;
    table-layout: fixed;
  }
  th, td {
    border: 1px solid #444;
    text-align: center;
    padding: 0;
    height: 40px;
    font-size: 13px;
    overflow: hidden;
  }
  th { height: 32px; }
  th {
    background: #2a2a2a;
    color: #ffcc66;
    font-weight: bold;
  }
  th:first-child {
    width: 78px;
  }
  /* Nome de cada corda, na esquerda */
  .nome-corda {
    background: #2a2a2a;
    color: #66ccff;
    font-weight: bold;
    text-align: left;
    padding-left: 8px;
    white-space: nowrap;
  }
  /* Casa 0 = corda solta */
  .casa0 {
    background: #333;
    font-weight: bold;
  }
  /* Casas com marcação (3, 5, 7, 9...) ficam esverdeadas e as 5, 12... azuladas */
  .casa-marcada {
    background: #26332a;
  }
  .casa-marcada-azul {
    background: #1f3a4d;
  }
  /* Cor da letra de cada nota */
  .nota-A { color: #ff8080; }
  .nota-B { color: #ffb380; }
  .nota-C { color: #ffe680; }
  .nota-D { color: #b3ff80; }
  .nota-E { color: #80ffcc; }
  .nota-F { color: #80d4ff; }
  .nota-G { color: #c080ff; }

  /* Bolinha branca da nota principal do acorde, no braço */
  .bolinha-nota {
    border: 2px solid #1a1a1a;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    min-width: 26px;
    height: 26px;
    padding: 0 3px;
    border-radius: 13px;
    background: #fff;
    color: #1a1a1a;
    font-weight: bold;
  }

  /* ---------- Teclado ---------- */
  /* Esconde o que não está em uso (ou o braço, ou o teclado) */
  #caixa-teclado[hidden], #braco[hidden] {
    display: none;
  }
  .teclado {
    position: relative;
    width: 100%;
    aspect-ratio: 35 / 4;
    container-type: inline-size;
  }
  .tecla-branca, .tecla-preta {
    position: absolute;
    top: 0;
    box-sizing: border-box;
    display: flex;
    align-items: flex-end;
    justify-content: center;
    padding-bottom: 6px;
  }
  .tecla-branca {
    height: 100%;
    background: #e6e6e6;
    border: 1px solid #555;
    border-radius: 0 0 6px 6px;
  }
  .tecla-preta {
    height: 60%;
    background: #0d0d0d;
    border: 1px solid #555;
    border-radius: 0 0 4px 4px;
    z-index: 2;
  }
  /* Brilho amarelo que acende na tecla (ou casa) enquanto o acorde toca */
  .nota-brilhando {
    box-shadow: 0 0 14px 6px #fff176, inset 0 0 10px 3px #fff176 !important;
    filter: brightness(1.6);
    transition: box-shadow 0.05s, filter 0.05s;
    z-index: 5;
  }
  /* Bolinha da nota dentro da tecla */
  .bolinha {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-sizing: border-box;
    padding: 0;
    color: #1a1a1a;
    font-weight: bold;
    /* O tamanho acompanha a largura do teclado */
    width: min(2.3cqw, 32px);
    height: min(2.3cqw, 32px);
    border-radius: 50%;
    font-size: min(1.05cqw, 15px);
  }
  .tecla-preta .bolinha {
    width: min(1.6cqw, 24px);
    height: min(1.6cqw, 24px);
    font-size: min(0.9cqw, 13px);
  }
  .nota-tecla { font-weight: bold; font-size: min(1.05cqw, 15px); }
  /* Número da oitava, no alto da tecla branca */
  .rotulo-oitava {
    position: absolute;
    top: 2px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: min(0.8cqw, 11px);
    color: #555;
    pointer-events: none;
  }
  .rotulo-oitava.sobre-cor { color: #fff; }
  /* Letra da mão (Esquerda / Direita) escrita de pé na tecla */
  .rotulo-mao {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: min(0.8cqw, 11px);
    font-weight: bold;
    color: #ffcc66;
    pointer-events: none;
    writing-mode: vertical-lr;
    line-height: 1.05;
    letter-spacing: -1px;
  }
  .rotulo-mao.mao-direita {
    color: #66ccff;
    text-shadow: 0 0 2px #000, 0 0 3px #000;
  }
  td { position: relative; }
  /* Numerozinho da oitava no cantinho da casa */
  .oitava-na-casa {
    position: absolute;
    right: 2px;
    bottom: 1px;
    font-size: 9px;
    line-height: 1;
    color: #ddd;
    text-shadow: 0 0 2px #000;
    pointer-events: none;
  }
  .tecla-preta .nota-tecla { font-size: min(0.9cqw, 13px); }
  /* Cores das bolinhas, uma pra cada letra */
  .bolinha-A { background: #ff8080; }
  .bolinha-B { background: #ffb380; }
  .bolinha-C { background: #ffe680; }
  .bolinha-D { background: #b3ff80; }
  .bolinha-E { background: #80ffcc; }
  .bolinha-F { background: #80d4ff; }
  .bolinha-G { background: #c080ff; }
  /* Bolinha da nota principal (fundamental) fica branca com borda */
  .bolinha.fundamental {
    background: #fff;
    border: 1.5px solid #1a1a1a;
    box-shadow: 0 0 0 1px #fff;
  }
</style>
<!-- Sons de instrumento de verdade. Os arquivos ficam na pasta "sounds" -->
<script defer src="sounds/WebAudioFontPlayer.js"></script>
<script defer src="sounds/0000_FluidR3_GM_sf2_file.js"></script>
<script defer src="sounds/0240_FluidR3_GM_sf2_file.js"></script>
<script defer src="sounds/0330_FluidR3_GM_sf2_file.js"></script>
</head>
<body>

<div class="quadro">
  <!-- PARTE DE CIMA: escolhas, título e o instrumento -->
  <div class="linha-topo">
    <div class="controles">
      <label for="escolha-instrumento">Instrumento</label>
      <select id="escolha-instrumento"></select>

      <span id="rotulo-campo" class="rotulo-campo">Campo</span>
      <div id="botoes-campo" class="botoes-campo" role="group" aria-labelledby="rotulo-campo"></div>

      <label for="escolha-tipo">Tipo</label>
      <select id="escolha-tipo">
        <option value="maior">Maior</option>
        <option value="menor">Menor</option>
      </select>

      <button type="button" id="botao-modo" class="botao-modo" aria-pressed="false">Modo acordes</button>
    </div>

    <div class="linha-info">
      <h1 id="titulo"></h1>
      <div id="info-campo" aria-live="polite"></div>
    </div>

    <div class="palco">
      <table id="braco"></table>
      <div id="caixa-teclado" hidden></div>
    </div>
  </div>

  <!-- PARTE DE BAIXO: os acordes do campo -->
  <div class="linha-baixo">
    <div class="caixa-chave-completo">
      <label class="chave-completo">
        <input type="checkbox" id="chave-completo" aria-label="Acorde completo">
        <span>Acorde<br>Completo</span>
      </label>
    </div>
    <div id="barra-acordes" class="barra-acordes" role="group" aria-label="Acordes do campo"></div>
    <div id="legenda-extensoes" class="legenda">Caixa marca/desmarca a extensão. Clique no nome (3ª, 9ª...) para ver as variações. Variação diferente da natural deixa o nome amarelo.</div>
  </div>
</div>

<script>
/* ============================================================
   1. OS CAMPOS (as escalas)
   Cada campo tem um nome e as 7 notas dele, em ordem.
   Os campos com sustenido e com bemol que têm o mesmo som
   (ex.: C# e Db) existem os dois, pra pessoa escolher.
   ============================================================ */

// Campos maiores
const tonalidadesMaiores = [
  { nome: "C",  notas: ["C","D","E","F","G","A","B"] },
  { nome: "G",  notas: ["G","A","B","C","D","E","F#"] },
  { nome: "D",  notas: ["D","E","F#","G","A","B","C#"] },
  { nome: "A",  notas: ["A","B","C#","D","E","F#","G#"] },
  { nome: "E",  notas: ["E","F#","G#","A","B","C#","D#"] },
  { nome: "B",  notas: ["B","C#","D#","E","F#","G#","A#"] },
  { nome: "F#", notas: ["F#","G#","A#","B","C#","D#","E#"] },
  { nome: "C#", notas: ["C#","D#","E#","F#","G#","A#","B#"] },
  { nome: "Db", notas: ["Db","Eb","F","Gb","Ab","Bb","C"] },
  { nome: "Gb", notas: ["Gb","Ab","Bb","Cb","Db","Eb","F"] },
  { nome: "Ab", notas: ["Ab","Bb","C","Db","Eb","F","G"] },
  { nome: "Eb", notas: ["Eb","F","G","Ab","Bb","C","D"] },
  { nome: "Bb", notas: ["Bb","C","D","Eb","F","G","A"] },
  { nome: "F",  notas: ["F","G","A","Bb","C","D","E"] }
];

// Campos menores
const tonalidadesMenores = [
  { nome: "Am",  notas: ["A","B","C","D","E","F","G"] },
  { nome: "Em",  notas: ["E","F#","G","A","B","C","D"] },
  { nome: "Bm",  notas: ["B","C#","D","E","F#","G","A"] },
  { nome: "F#m", notas: ["F#","G#","A","B","C#","D","E"] },
  { nome: "C#m", notas: ["C#","D#","E","F#","G#","A","B"] },

/* ============================================================
   3. NÚMERO DE CADA NOTA
   Toda nota vira um número de 0 a 11 (C = 0, C#/Db = 1, D = 2...).
   Assim C# e Db dão o mesmo número, porque soam igual.
   ============================================================ */
const NUMERO_BASE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function numeroDaNota(nome) {
  let num = NUMERO_BASE[nome[0]];
  // "#" sobe meio tom, "b" desce meio tom
  if (nome.length > 1) num += nome[1] === "#" ? 1 : -1;
  return (num + 12) % 12;
}

/* ============================================================
   4. O SOM
   Aqui o programa toca os acordes.

// O "motor" de som do navegador. Só é criado na primeira vez que precisa.
let contextoAudio = null;
function pegarContextoAudio() {
  if (!contextoAudio) contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
  // Alguns navegadores deixam o som pausado até a pessoa clicar. Aqui a gente liga.
  if (contextoAudio.state === "suspended") contextoAudio.resume();
  return contextoAudio;
}

// Descobre o "tamanho" do som (em Hz) de uma nota, dados o número dela e a oitava
function frequenciaDaNota(num, oitava) {
  const midi = num + (oitava + 1) * 12;
  return 440 * Math.pow(2, (midi - 69) / 12);
}

// ---- Sons de instrumento gravado (arquivos da pasta "sounds") ----

// Qual som gravado cada instrumento usa
const TIMBRE_POR_INSTRUMENTO = {
  vl6: "_tone_0240_FluidR3_GM_sf2_file", vl7: "_tone_0240_FluidR3_GM_sf2_file",
  bx4: "_tone_0330_FluidR3_GM_sf2_file", bx5: "_tone_0330_FluidR3_GM_sf2_file", bx6: "_tone_0330_FluidR3_GM_sf2_file",
  pia: "_tone_0000_FluidR3_GM_sf2_file"
};
let tocadorAmostras = null;
// Guarda quais sons já começaram a ser preparados (pra não preparar duas vezes)
const timbresPreparando = {};

// Diz se o som gravado já está pronto pra tocar
function timbrePronto(nome) {
  const timbre = window[nome];
  return !!(timbre && timbre.zones && timbre.zones.length && timbre.zones.every(z => z.buffer));
}

// Começa a preparar um som gravado. Demora um pouquinho e roda "ao fundo".
// Se algo faltar, só não usa o som gravado e o programa toca o som simples.
function prepararTimbre(nome) {
  if (timbresPreparando[nome] || typeof WebAudioFontPlayer === "undefined" || !window[nome] || !contextoAudio) return;
  timbresPreparando[nome] = true;
  try {
    if (!tocadorAmostras) tocadorAmostras = new WebAudioFontPlayer();
    tocadorAmostras.adjustPreset(contextoAudio, window[nome]);
  } catch (e) { console.warn("Falha ao preparar o som", nome, e); }
}

// Prepara todos os sons assim que a página termina de abrir
function preCarregarSons() {
  try {
    if (!contextoAudio) contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
    Object.values(TIMBRE_POR_INSTRUMENTO).forEach((n, i, todos) => { if (todos.indexOf(n) === i) prepararTimbre(n); });
  } catch (e) { console.warn("Não deu pra preparar os sons antes", e); }
}
window.addEventListener("load", preCarregarSons);

// Toca UMA nota com o som gravado.
// Devolve "falso" se não conseguiu (aí quem chamou usa o som simples).
function tocarNotaDeAmostra(freq, quando, duracao, volume) {
  const nome = TIMBRE_POR_INSTRUMENTO[instrumentoAtual.id];
  if (!nome) return false;
  prepararTimbre(nome);
  if (!tocadorAmostras || !timbrePronto(nome)) return false;
  try {
    const midi = Math.round(69 + 12 * Math.log2(freq / 440));
    tocadorAmostras.queueWaveTable(contextoAudio, contextoAudio.destination, window[nome], quando, midi, duracao, volume);
    return true;
  } catch (e) { return false; }
}

// Monta a lista de TODAS as notas que estão aparecendo na tela agora pra esse acorde.
// Cada item é uma corda (ou tecla) que toca: { freq: som em Hz, el: casa/tecla na tela }.
// A lista sai SEMPRE da nota mais grave pra mais aguda.
// É refeita a cada clique no "Ouvir", então acompanha qualquer mudança
// (extensão nova como a 11ª, inversão, formato, acorde completo...).
function vozesDoAcorde(numAcorde, partes) {
  const vozes = [];
  if (instrumentoAtual.tipo === "teclado") {
    const pegada = pegadaTeclado(numAcorde, partes);
    pegada.posicoes.forEach(({ absoluta }) => {
      // "absoluta" conta as teclas desde o primeiro C do teclado (que é o C2)
      const num = ((absoluta % 12) + 12) % 12;
      const oitava = 2 + Math.floor(absoluta / 12);
      vozes.push({
        freq: frequenciaDaNota(num, oitava),
        el: caixaTeclado.querySelector('.tecla-branca[data-absoluta="' + absoluta + '"], .tecla-preta[data-absoluta="' + absoluta + '"]')
      });
    });
  } else {
    if (!instrumentoAtual.afinacao) return [];
    const afinacao = instrumentoAtual.afinacao.map(numeroDaNota);
    const oitavaCordaSolta = instrumentoAtual.oitavaCordaSolta || 2;
    // Quantos meios-tons cada corda solta está acima da primeira corda
    const meiosTonsDaCorda = [0];
    for (let j = 1; j < afinacao.length; j++) meiosTonsDaCorda.push(meiosTonsDaCorda[j - 1] + ((afinacao[j] - afinacao[j - 1] + 12) % 12));
    const pegadas = listaDePegadas(numAcorde, partes);
    if (!pegadas.length) return [];
    const pegada = pegadas[indiceForma[numAcorde] % pegadas.length];
    // Uma voz por corda que toca (a mesma nota em duas cordas vira duas vozes)
    pegada.notaPorCorda.forEach((nota, k) => {
      if (nota === null) return;
      const corda = pegada.cordaInicial + k;
      const casa = pegada.casas[k];
      const midi = (oitavaCordaSolta + 1) * 12 + afinacao[0] + meiosTonsDaCorda[corda] + casa;
      vozes.push({
        freq: 440 * Math.pow(2, (midi - 69) / 12),
        el: tabela.querySelector('td[data-corda="' + corda + '"][data-casa="' + casa + '"]')
      });
    });
  }
  // Da mais grave pra mais aguda. Sempre.
  vozes.sort((a, b) => a.freq - b.freq);
  return vozes;
}

// Toca o acorde: primeiro uma nota de cada vez (da mais grave pra mais aguda),
// depois todas juntas.
// "vozes" = lista que vem de vozesDoAcorde (já em ordem).
// "aoTocarNota" avisa quando cada nota toca (pra acender na tela).
// "aoTocarJuntas" avisa quando as notas juntas começam e quando terminam.
function tocarSomDoAcorde(vozes, aoTocarNota, aoTocarJuntas) {
  if (!vozes.length) return;
  const contexto = pegarContextoAudio();
  const inicio = contexto.currentTime;
  const intervalo = 0.38; // tempo entre uma nota e a outra
  vozes.forEach((voz, k) => {
    const inicioNota = inicio + k * intervalo;
    if (!tocarNotaDeAmostra(voz.freq, inicioNota, intervalo + 0.45, 0.5)) {
      // Som simples (de reserva), caso o som gravado não esteja pronto
      const oscilador = contexto.createOscillator();
      const volume = contexto.createGain();
      oscilador.type = "triangle";
      oscilador.frequency.value = voz.freq;
      volume.gain.setValueAtTime(0, inicioNota);
      volume.gain.linearRampToValueAtTime(0.22, inicioNota + 0.02);
      volume.gain.exponentialRampToValueAtTime(0.001, inicioNota + intervalo + 0.4);
      oscilador.connect(volume);
      volume.connect(contexto.destination);
      oscilador.start(inicioNota);
      oscilador.stop(inicioNota + intervalo + 0.45);
    }
    if (aoTocarNota) {
      const atrasoMs = Math.max(0, (inicioNota - contexto.currentTime) * 1000);
      setTimeout(() => aoTocarNota(k), atrasoMs);
    }
  });
  // Depois de tocar uma a uma, toca todas as notas juntas
  const inicioJuntas = inicio + vozes.length * intervalo + 0.15;
  const duracaoJuntas = 1.4;
  const volumeJuntas = Math.min(0.22, 0.6 / vozes.length);
  vozes.forEach(voz => {
    if (tocarNotaDeAmostra(voz.freq, inicioJuntas, duracaoJuntas, Math.min(0.5, 1.4 / vozes.length))) return;
    const oscilador = contexto.createOscillator();
    const volume = contexto.createGain();
    oscilador.type = "triangle";
    oscilador.frequency.value = voz.freq;
    volume.gain.setValueAtTime(0, inicioJuntas);
    volume.gain.linearRampToValueAtTime(volumeJuntas, inicioJuntas + 0.015);
    volume.gain.exponentialRampToValueAtTime(0.001, inicioJuntas + duracaoJuntas);
    oscilador.connect(volume);
    volume.connect(contexto.destination);
    oscilador.start(inicioJuntas);
    oscilador.stop(inicioJuntas + duracaoJuntas + 0.05);
  });
  if (aoTocarJuntas) {
    const atrasoMs = Math.max(0, (inicioJuntas - contexto.currentTime) * 1000);
    setTimeout(() => aoTocarJuntas(), atrasoMs);
    setTimeout(() => aoTocarJuntas(true), atrasoMs + duracaoJuntas * 1000);
  }
}

};
const NOMES_BEMOL = ["C", "Db", "D", "Eb", "E", "F", "Gb", "G", "Ab", "A", "Bb", "B"];
const NOMES_SUSTENIDO = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

// Escreve o nome de uma nota usando a letra de uma nota de referência.
// Ex.: o #9 de C é D# (e não Eb). Nunca usa sustenido ou bemol duplo.
function escreverNota(ref, num, nomeRaiz) {
  const letra = ref[0];
  const diferenca = (num - NUMERO_BASE[letra] + 12) % 12;
  if (diferenca === 0) return letra;
  if (diferenca === 1) return letra + "#";
  if (diferenca === 11) return letra + "b";
  // Se não dá com a mesma letra, usa bemol ou sustenido conforme o campo
  const usaBemol = nomeRaiz.indexOf("b") > 0 || nomeRaiz === "F";
  return (usaBemol ? NOMES_BEMOL : NOMES_SUSTENIDO)[num];
}

// Até quantas casas a mão pode abrir pra fazer o acorde
const ABERTURA = 4;

/* ============================================================
   8. MONTAR OS ACORDES DO CAMPO
   Pra cada nota do campo, monta o acorde em cima dela:
   o nome, as notas e o número romano.
   Leva em conta as extensões e os jeitos que a pessoa escolheu.
   ============================================================ */
function acordesDoCampo(campo) {
  return campo.notas.map((raiz, i) => {
    // Pega a nota que está "k" passos depois da raiz, dentro do campo
    const notaAdiante = k => campo.notas[(i + k) % 7];
    const numRaiz = numeroDaNota(raiz);
    // Distância (em meios-tons) de uma nota até a raiz
    const intervalo = n => (numeroDaNota(n) - numRaiz + 12) % 12;
    const numeralMaiusculo = ROMANOS[i];
    const numeralMinusculo = numeralMaiusculo.toLowerCase();
    const marcadas = opcoes[i];
    const escolhidas = variacaoEscolhida[i];
    // Distância natural de cada extensão (a que o campo já traz)
    const doCampo = {
      terca: intervalo(notaAdiante(2)), quinta: intervalo(notaAdiante(4)), setima: intervalo(notaAdiante(6)),
      nona: intervalo(notaAdiante(1)), onze: intervalo(notaAdiante(3)), treze: intervalo(notaAdiante(5))
    };
    // O jeito natural (normal) de cada extensão nesse acorde
    const natural = {
      terca: "nat", quinta: "nat",
      setima: doCampo.setima === 11 ? "maior" : "menor",
      nona: doCampo.nona === 1 ? "b9" : "9",
      onze: doCampo.onze === 5 ? "11" : "#11",
      treze: doCampo.treze === 9 ? "13" : "b13"
    };
    // A distância que vale de verdade (a escolhida pela pessoa, ou a natural)
    const efetivo = {};
    // Diz se a pessoa mudou o jeito normal daquela extensão
    const alterada = {};
    EXTENSOES.forEach(({ chave }) => {
      const escolhida = escolhidas[chave] || natural[chave];
      const semitons = SEMITONS_VARIACAO[chave][escolhida];
      efetivo[chave] = semitons === undefined ? doCampo[chave] : semitons;
      alterada[chave] = efetivo[chave] !== doCampo[chave];
    });

    // Descobre o tipo do acorde (com 2ª ou 4ª no lugar da 3ª, menor, diminuto, aumentado...)
    const suspenso = efetivo.terca === 2 ? "sus2" : efetivo.terca === 5 ? "sus4" : "";
    const ehMenor = !suspenso && efetivo.terca === 3;
    const triadeDim = ehMenor && efetivo.quinta === 6 && marcadas.quinta;
    const triadeAum = !suspenso && !ehMenor && efetivo.quinta === 8 && marcadas.quinta;
    const quintaAlterada = (marcadas.quinta && !triadeDim && !triadeAum && efetivo.quinta !== 7) ? (efetivo.quinta === 6 ? "(b5)" : "(#5)") : "";
    const triadeSimples = !suspenso && !triadeAum && !quintaAlterada;

    // Parte do nome só com as 3 notas base (raiz, 3ª, 5ª)
    let sufixoTriade, romanoTriade;
    if (suspenso) { sufixoTriade = suspenso + quintaAlterada; romanoTriade = numeralMaiusculo + suspenso + quintaAlterada; }
    else if (triadeDim) { sufixoTriade = "dim"; romanoTriade = numeralMinusculo + "°"; }
    else if (triadeAum) { sufixoTriade = "aug"; romanoTriade = numeralMaiusculo + "+"; }
    else { sufixoTriade = (ehMenor ? "m" : "") + quintaAlterada; romanoTriade = (ehMenor ? numeralMinusculo : numeralMaiusculo) + quintaAlterada; }

    // Parte do nome quando a 7ª está ligada
    const setima = efetivo.setima;
    const setimaBase = setima === 11 ? "7M" : setima === 10 ? "7" : "°7";
    let sufixoSetima, romanoSetima;
    if (triadeDim) {
      sufixoSetima = setima === 10 ? "m7(b5)" : setima === 9 ? "dim7" : "dim(7M)";
      romanoSetima = setima === 10 ? numeralMinusculo + "ø" : setima === 9 ? numeralMinusculo + "°7" : numeralMinusculo + "°(7M)";
    } else if (suspenso) {
      sufixoSetima = setimaBase + suspenso + quintaAlterada; romanoSetima = numeralMaiusculo + setimaBase + suspenso + quintaAlterada;
    } else if (triadeAum) {
      sufixoSetima = setimaBase + "(#5)"; romanoSetima = numeralMaiusculo + setimaBase + "(#5)";
    } else if (ehMenor) {
      sufixoSetima = "m" + (setima === 11 ? "(7M)" : setima === 9 ? "(°7)" : "7") + quintaAlterada;
      romanoSetima = numeralMinusculo + setimaBase + quintaAlterada;
    } else {
      sufixoSetima = (setima === 9 ? "(°7)" : setimaBase) + quintaAlterada;
      romanoSetima = numeralMaiusculo + (setima === 9 ? "(°7)" : setimaBase) + quintaAlterada;
    }
    // Acorde com 7ª "simples" (do tipo C7, G7)
    const ehDominante = sufixoSetima === "7";

    // Escreve uma nota que está tantos meios-tons acima da raiz
    const escrever = (ref, semitons) => escreverNota(ref, (numRaiz + semitons) % 12, raiz);
    // Nome da nota da extensão: muda só se a pessoa alterou
    const nomeNota = (chave, ref) => alterada[chave] ? escrever(ref, efetivo[chave]) : ref;

    // Lista de notas do acorde (cada uma com o nome e o "grau": R, 3, 5, 7, 9, 11 ou 13)
    const partes = [{ nome: raiz, grau: "R" }];
    if (marcadas.terca) partes.push({ nome: suspenso ? escrever(suspenso === "sus2" ? notaAdiante(1) : notaAdiante(3), efetivo.terca) : notaAdiante(2), grau: "3" });
    if (marcadas.quinta) partes.push({ nome: nomeNota("quinta", notaAdiante(4)), grau: "5" });
    if (marcadas.setima) partes.push({ nome: nomeNota("setima", notaAdiante(6)), grau: "7" });
    if (marcadas.nona) partes.push({ nome: nomeNota("nona", notaAdiante(1)), grau: "9" });
    if (marcadas.onze) partes.push({ nome: nomeNota("onze", notaAdiante(3)), grau: "11" });
    if (marcadas.treze) partes.push({ nome: nomeNota("treze", notaAdiante(5)), grau: "13" });

    // Nomes das extensões ligadas (9, 11, 13) pra colocar no nome do acorde
    const rotulos = [];
    if (marcadas.nona) rotulos.push(efetivo.nona === 1 ? "b9" : efetivo.nona === 2 ? "9" : "#9");
    if (marcadas.onze) rotulos.push(efetivo.onze === 5 ? "11" : "#11");
    if (marcadas.treze) rotulos.push(efetivo.treze === 9 ? "13" : "b13");
    const qtd = rotulos.length;
    const lista = qtd ? rotulos.join(",") : "";

    // Monta o nome final e o número romano
    let sufixo, romano;
    if (marcadas.setima) {
      // Se as extensões vêm em sequência (9, depois 11, depois 13) e são todas normais, o nome encurta (C9, C11, C13)
      const emSequencia = qtd === 0 || (qtd === 1 && marcadas.nona) || (qtd === 2 && marcadas.nona && marcadas.onze) || qtd === 3;
      const todasNaturais = rotulos.every(l => l.indexOf("b") < 0 && l.indexOf("#") < 0);
      sufixo = ehDominante && qtd > 0 && emSequencia && todasNaturais ? ["9", "11", "13"][qtd - 1] : sufixoSetima + (qtd ? "(" + lista + ")" : "");
      romano = romanoSetima + (qtd ? "(" + lista + ")" : "");
    } else if (triadeSimples && marcadas.treze && !marcadas.nona && !marcadas.onze && efetivo.treze === 9) { // Só vira "6" quando a 9ª NÃO está ligada. Com a 9ª, a nota é sempre "13".
      sufixo = sufixoTriade + "6"; romano = romanoTriade + "6";
    } else if (qtd) {
      sufixo = sufixoTriade + "(add" + lista + ")"; romano = romanoTriade + "(add" + lista + ")";
    } else {
      sufixo = sufixoTriade; romano = romanoTriade;
    }
    // Sem a 5ª ou sem a 3ª, o nome avisa
    if (!marcadas.quinta) sufixo += "(no5)";
    if (!marcadas.terca) { sufixo = "5"; romano = numeralMaiusculo + "5"; }
    return { romano: romano, nome: raiz + sufixo, notas: partes.map(x => x.nome), partes: partes, natural: natural, alterada: alterada };
  });
}

// Coloca um texto dentro de um pedaço da página, deixando ele quebrar a linha
// depois de vírgula ou antes de parêntese (pra nomes grandes não estourarem o botão)
function permitirQuebraDeLinha(elemento, texto) {
  texto.split(/(?<=,)|(?=\()/).forEach((pedaco, k) => {
    if (k) elemento.appendChild(document.createElement("wbr"));
    elemento.appendChild(document.createTextNode(pedaco));
  });
}

/* ============================================================
   9. CAMPOS DISPONÍVEIS E BOTÕES
   ============================================================ */

// Lista os campos do tipo escolhido (maior ou menor), em ordem de som.
// Quando dois campos têm o mesmo som (C# e Db), o de sustenido vem primeiro.
function camposDoTipo(tipo) {
  const lista = tipo === "maior" ? tonalidadesMaiores : tonalidadesMenores;
  const temBemol = c => c.notas[0].indexOf("b") > 0 ? 1 : 0;
  return [...lista].sort((a, b) => numeroDaNota(a.notas[0]) - numeroDaNota(b.notas[0]) || temBemol(a) - temBemol(b));
}

// Escreve o título do campo (ex.: "Db maior")
function tituloDoCampo(campo) {
  const ehMenor = campo.nome.endsWith("m");
  const raiz = ehMenor ? campo.nome.slice(0, -1) : campo.nome;
  return raiz + (ehMenor ? " menor" : " maior");
}

// Faz uma tabela: nota (pelo número) -> nome da nota, só com as notas do campo
function notasDoCampo() {
  const mapa = new Map();
  campoAtual.notas.forEach(n => mapa.set(numeroDaNota(n), n));
  return mapa;
}

// Quando troca entre maior e menor, procura o campo que começa na mesma nota.
// Se existirem dois (sustenido e bemol), fica com o mesmo jeito que estava usando.
function acharCampoParecido(raizAntiga) {
  const lista = camposDoTipo(tipoAtual);
  const numAntigo = numeroDaNota(raizAntiga);
  const mesmoSom = lista.filter(c => numeroDaNota(c.notas[0]) === numAntigo);
  const usavaBemol = raizAntiga.indexOf("b") > 0;
  return mesmoSom.find(c => (c.notas[0].indexOf("b") > 0) === usavaBemol) || mesmoSom[0];
}

/* ============================================================
   10. FORMAS DE TOCAR O ACORDE NO BRAÇO (violão e baixo)
   "Pegada" = um jeito de colocar os dedos pra fazer o acorde.
   O programa testa todas as combinações e guarda as que cabem na mão.
   ============================================================ */

// Todas as ordens possíveis de uma lista de "n" números (ex.: 0,1,2 -> 012, 021, 102...)
function permutacoes(n) {
  const saida = [];
  const montar = (atual, resto) => {
    if (!resto.length) { saida.push(atual); return; }
    resto.forEach((x, k) => montar([...atual, x], resto.filter((_, j) => j !== k)));
  };
  montar([], [...Array(n).keys()]);
  return saida;
}
// Guarda as ordens já calculadas, pra não refazer a conta
const PERMUTACOES_POR_N = {};
// Guarda as pegadas já calculadas de cada acorde, pelo mesmo motivo
const cacheDePegadas = new Map();

// Acha todas as pegadas de um acorde, usando uma corda diferente pra cada nota.
// "numsAcorde" = o número de cada nota do acorde.
// Cada pegada diz: em qual corda começa, qual nota vai em cada corda e em qual casa.
function pegadasPara(numsAcorde) {
  if (!instrumentoAtual.afinacao) return [];
  const n = numsAcorde.length;
  const afinacao = instrumentoAtual.afinacao.map(numeroDaNota);
  if (n > afinacao.length) return [];
  // Acordes com mais notas deixam a mão abrir um pouco mais
  const abertura = ABERTURA + (n - 3);
  // Altura de cada corda solta (pra saber qual nota fica mais grave)
  const alturaCordaSolta = [afinacao[0]];
  for (let j = 1; j < afinacao.length; j++) alturaCordaSolta.push(alturaCordaSolta[j - 1] + ((afinacao[j] - afinacao[j - 1] + 12) % 12));
  const chaveCache = instrumentoAtual.id + "|" + numsAcorde.join(",");
  if (cacheDePegadas.has(chaveCache)) return cacheDePegadas.get(chaveCache);
  if (!PERMUTACOES_POR_N[n]) PERMUTACOES_POR_N[n] = permutacoes(n);
  const saida = [];
  // Testa começar em cada corda possível...
  for (let cordaIni = 0; cordaIni <= afinacao.length - n; cordaIni++) {
    // ...e cada ordem possível das notas nas cordas
    for (const ordem of PERMUTACOES_POR_N[n]) {
      // Em quais casas cada nota aparece na corda dela
      const casasPossiveis = ordem.map((nota, k) => {
        const lista = [];
        for (let f = 0; f <= NUM_CASAS; f++) {
          if ((afinacao[cordaIni + k] + f) % 12 === numsAcorde[nota]) lista.push(f);
        }
        return lista;
      });
      const acumulado = [];
      // Vai escolhendo uma casa pra cada corda, só aceitando se a mão alcança
      const combinar = (k, menor, maior) => {
        if (k === n) {
          // Terminou: descobre qual nota ficou no baixo (a mais grave)
          let baixo = 0, menorAltura = Infinity;
          acumulado.forEach((f, j) => { const altura = alturaCordaSolta[cordaIni + j] + f; if (altura < menorAltura) { menorAltura = altura; baixo = ordem[j]; } });
          saida.push({ cordaInicial: cordaIni, notaPorCorda: ordem, casas: acumulado.slice(), casaMinima: menor, baixo: baixo });
          return;
        }
        for (const f of casasPossiveis[k]) {
          const novoMenor = Math.min(menor, f), novoMaior = Math.max(maior, f);
          if (novoMaior - novoMenor > abertura) continue;
          acumulado.push(f); combinar(k + 1, novoMenor, novoMaior); acumulado.pop();
        }
      };
      combinar(0, Infinity, -Infinity);
    }
  }
  // Deixa as pegadas mais perto da ponta do braço primeiro
  saida.sort((x, y) => x.casaMinima - y.casaMinima || x.cordaInicial - y.cordaInicial || x.baixo - y.baixo);
  cacheDePegadas.set(chaveCache, saida);
  return saida;
}

// Pegada "de verdade" (a tradicional do violão), usando TODAS as cordas
// a partir da corda do baixo escolhido. Pode repetir notas em mais de uma corda
// (ex.: Mi maior aberto). Cada corda toca a nota do acorde mais perto da corda solta.
// Devolve no mesmo formato de "pegadasPara". Corda que não toca fica com "null".
function pegadasCompletasPara(numsAcorde, notaDoBaixo) {
  if (!instrumentoAtual.afinacao) return [];
  const afinacao = instrumentoAtual.afinacao.map(numeroDaNota);
  const qtdCordas = afinacao.length;
  const numBaixo = numsAcorde[notaDoBaixo];

  // Tamanho da região do braço que a mão alcança (cresce com acordes de mais notas)
  const JANELA = Math.min(11, 4 + Math.max(0, numsAcorde.length - 3) * 2);
  const saida = [];
  for (let casaInicial = 0; casaInicial <= NUM_CASAS - JANELA; casaInicial++) {
    // Procura a corda mais grave que consegue tocar a nota do baixo
    let cordaDoBaixo = -1, casaDoBaixo = -1;
    for (let s = 0; s < qtdCordas; s++) {
      for (let f = casaInicial; f <= casaInicial + JANELA; f++) {
        if ((afinacao[s] + f) % 12 === numBaixo) { cordaDoBaixo = s; casaDoBaixo = f; break; }
      }
      if (cordaDoBaixo >= 0) break;
    }
    if (cordaDoBaixo < 0) continue;
    const notaPorCorda = new Array(qtdCordas).fill(null);
    const casas = new Array(qtdCordas).fill(null);
    notaPorCorda[cordaDoBaixo] = notaDoBaixo;
    casas[cordaDoBaixo] = casaDoBaixo;
    // Nas cordas mais agudas, usa a primeira nota do acorde que aparecer na região
    for (let s = cordaDoBaixo + 1; s < qtdCordas; s++) {
      let melhor = null;
      for (let f = casaInicial; f <= casaInicial + JANELA; f++) {
        const num = (afinacao[s] + f) % 12;
        const nota = numsAcorde.indexOf(num);
        if (nota >= 0) { melhor = { f, nota }; break; }
      }
      if (melhor) { casas[s] = melhor.f; notaPorCorda[s] = melhor.nota; }
    }
    // Só vale se todas as notas do acorde apareceram
    const cobertas = new Set(notaPorCorda.filter(t => t !== null));
    if (cobertas.size < numsAcorde.length) continue;
    // As cordas antes da corda do baixo ficam de fora (abafadas)
    saida.push({ cordaInicial: 0, notaPorCorda: notaPorCorda, casas: casas, casaMinima: casaInicial, baixo: notaDoBaixo, abafadasAntes: cordaDoBaixo });
  }
  saida.sort((x, y) => x.casaMinima - y.casaMinima);
  return saida;
}

// Se o acorde tem notas demais pro instrumento (poucas cordas), tira as menos
// importantes, nessa ordem, até caber
const ORDEM_DESCARTE = ["5", "11", "9", "13", "7"];
function notasParaTocar(acorde) {
  let partes = acorde.partes.slice();
  if (!instrumentoAtual.afinacao) return partes;
  const maxCordas = instrumentoAtual.afinacao.length;
  if (acordeCompleto) {
    // No "acorde completo" tenta manter todas as notas (a pegada tradicional
    // pode repetir notas em outras cordas, então nem sempre precisa tirar nada)
    const nums0 = partes.map(x => numeroDaNota(x.nome));
    if (pegadasCompletasPara(nums0, 0).length) return partes;
  }
  while (!(partes.length <= maxCordas && pegadasPara(partes.map(x => numeroDaNota(x.nome))).length)) {
    const grau = ORDEM_DESCARTE.find(g => partes.some(x => x.grau === g));
    if (!grau || partes.length <= 3) break;
    partes = partes.filter(x => x.grau !== grau);
  }
  return partes;
}

// Quais inversões (qual nota no baixo) existem de verdade pro acorde nesse instrumento
function opcoesInversao(partes) {
  const todas = pegadasPara(partes.map(x => numeroDaNota(x.nome)));
  return partes.map((p, ind) => ({ grau: p.grau, ind: ind }))
    .filter(o => GRAUS_INVERSAO.includes(o.grau) && todas.some(v => v.baixo === o.ind));
}

// A lista de pegadas do acorde, já com a inversão escolhida
function listaDePegadas(numAcorde, partes) {
  if (acordeCompleto && instrumentoAtual.afinacao) {
    const nums = partes.map(x => numeroDaNota(x.nome));
    const opcoesInv = opcoesInversao(partes);
    const escolhida = opcoesInv.find(o => o.grau === indiceInversao[numAcorde]) || opcoesInv[0] || { ind: 0 };
    const completas = pegadasCompletasPara(nums, escolhida.ind);
    if (completas.length) return completas;
    // Se não dá pra fazer a pegada tradicional (notas demais pras cordas), usa a normal
  }
  const todas = pegadasPara(partes.map(x => numeroDaNota(x.nome)));
  const opcoesInv = opcoesInversao(partes);
  if (!opcoesInv.length) return todas;
  const escolhida = opcoesInv.find(o => o.grau === indiceInversao[numAcorde]) || opcoesInv[0];
  return todas.filter(v => v.baixo === escolhida.ind);
}

// Qual grau (R, 3, 5, 7...) está no baixo agora
function grauDoBaixo(numAcorde, partes) {
  const pegadas = listaDePegadas(numAcorde, partes);
  if (!pegadas.length) return indiceInversao[numAcorde];
  return partes[pegadas[indiceForma[numAcorde] % pegadas.length].baixo].grau;
}

// Qual nota está no baixo agora (o nome dela)
function nomeNotaDoBaixo(numAcorde, partes) {
  const ehTeclado = instrumentoAtual.tipo === "teclado";
  if (ehTeclado) {
    const ops = opcoesInversaoTeclado(partes);
    const escolhida = ops.find(o => o.grau === indiceInversao[numAcorde]) || ops[0];
    return escolhida ? partes[escolhida.ind].nome : partes[0].nome;
  }
  const pegadas = listaDePegadas(numAcorde, partes);
  if (!pegadas.length) return partes[0].nome;
  return partes[pegadas[indiceForma[numAcorde] % pegadas.length].baixo].nome;
}

// Nome do acorde como aparece no botão. Se o baixo não é a nota principal,
// escreve assim: "C / E" (com espaço dos dois lados da barra)
function nomeAcordeExibido(numAcorde, acorde, partes) {
  const baixo = nomeNotaDoBaixo(numAcorde, partes);
  const nomeRaiz = partes[0].nome;
  return baixo === nomeRaiz ? acorde.nome : acorde.nome + " / " + baixo;
}

// Descobre quais casas do braço devem ser pintadas (de todos os acordes ligados)
function celulasDosAcordes() {
  const celulas = new Map();
  const acordes = acordesDoCampo(campoAtual);
  [...escolhidos].sort((x, y) => x - y).forEach(numAcorde => {
    const acorde = acordes[numAcorde];
    const partes = notasParaTocar(acorde);
    const pegadas = listaDePegadas(numAcorde, partes);
    if (!pegadas.length) return;
    const pegada = pegadas[indiceForma[numAcorde] % pegadas.length];
    pegada.notaPorCorda.forEach((nota, k) => {
      if (nota === null) return;
      const chave = (pegada.cordaInicial + k) + "," + pegada.casas[k];
      const anterior = celulas.get(chave);
      // Se dois acordes usam a mesma casa, ela fica com as duas cores
      const cores = anterior ? anterior.cores.slice() : [];
      if (!cores.includes(CORES_ACORDES[numAcorde])) cores.push(CORES_ACORDES[numAcorde]);
      const corBolinha = nota === 0 ? CORES_BOLINHAS[numAcorde] : (anterior && anterior.corBolinha);
      celulas.set(chave, { nome: partes[nota].nome, ehRaiz: nota === 0 || !!(anterior && anterior.ehRaiz), corBolinha: corBolinha, cores: cores });
    });
  });
  return celulas;
}

/* ============================================================
   11. FORMAS DE TOCAR O ACORDE NO TECLADO
   ============================================================ */

// Quais inversões existem no teclado (aqui todas servem)
function opcoesInversaoTeclado(partes) {
  return partes.map((p, ind) => ({ grau: p.grau, ind: ind })).filter(o => GRAUS_INVERSAO.includes(o.grau));
}

// No teclado, cada "forma" é o acorde numa oitava diferente
function quantidadeFormasTeclado() {
  return OITAVAS_TECLADO;
}

// Calcula em quais teclas cada nota do acorde vai ficar.
// "absoluta" = a posição da tecla, contando de 0 (o primeiro C do teclado).
function pegadaTeclado(numAcorde, partes) {
  const opcoesInv = opcoesInversaoTeclado(partes);
  const escolhida = opcoesInv.find(o => o.grau === indiceInversao[numAcorde]) || opcoesInv[0] || { ind: 0 };
  const n = partes.length;
  // Começa pela nota do baixo e segue as outras em volta
  const ordem = partes.map((_, i) => (escolhida.ind + i) % n);
  const oitavaBase = indiceForma[numAcorde] % quantidadeFormasTeclado();
  const posicoes = ordem.map((indice, k) => {
    const num = numeroDaNota(partes[indice].nome);
    return { indice: indice, num: num, absoluta: num + oitavaBase * 12 };
  });
  // Cada nota tem que ficar acima da anterior
  for (let k = 1; k < posicoes.length; k++) {
    while (posicoes[k].absoluta <= posicoes[k - 1].absoluta) posicoes[k].absoluta += 12;
  }
  if (acordeCompleto) {
    // Mão esquerda (grave): a nota principal + a 5ª, mais o que não couber na direita.
    // Mão direita: no máximo 5 notas. As duas mãos juntas sempre têm TODAS as notas do acorde.
    const MAX_DIREITA = MAX_NOTAS_MAO_DIREITA;
    const grauEscolhido = partes[escolhida.ind] ? partes[escolhida.ind].grau : "R";
    const direita = posicoes.slice();
    const sobra = [];
    for (const g of ORDEM_SOBRA_MAO_DIREITA) {
      if (direita.length <= MAX_DIREITA) break;
      if (g === grauEscolhido) continue; // a nota do baixo escolhido fica na mão direita
      const pos = direita.findIndex(a => partes[a.indice].grau === g);
      if (pos >= 0) sobra.push(direita.splice(pos, 1)[0].indice);
    }
    const indicesEsquerda = [];
    ["R", "5"].forEach(g => { const ix = partes.findIndex(p => p.grau === g); if (ix >= 0) indicesEsquerda.push(ix); });
    sobra.forEach(ix => { if (!indicesEsquerda.includes(ix)) indicesEsquerda.push(ix); });
    // Por segurança: nota que não ficou em nenhuma mão vai pra esquerda
    partes.forEach((_, ix) => { if (!indicesEsquerda.includes(ix) && !direita.some(a => a.indice === ix)) indicesEsquerda.push(ix); });
    const numRaiz = numeroDaNota(partes[0].nome);
    const esquerda = indicesEsquerda.map(indice => {
      const num = numeroDaNota(partes[indice].nome);
      return { indice: indice, num: num, distancia: (num - numRaiz + 12) % 12 };
    }).sort((x, y) => x.distancia - y.distancia || x.indice - y.indice);
    const inicioEsquerda = numRaiz + (oitavaBase - 1) * 12;
    esquerda.forEach((nota, k) => {
      nota.absoluta = inicioEsquerda + nota.distancia;
      while (k && nota.absoluta <= esquerda[k - 1].absoluta) nota.absoluta += 12;
    });
    // A mão esquerda tem que ficar toda abaixo da direita
    const menorDireita = direita[0].absoluta;
    while (Math.max(...esquerda.map(x => x.absoluta)) >= menorDireita) esquerda.forEach(x => { x.absoluta -= 12; });
    const todas = esquerda.map(x => ({ indice: x.indice, num: x.num, absoluta: x.absoluta, mao: "Esquerda" }))
      .concat(direita.map(a => ({ ...a, mao: "Direita" })));
    // Se passou do começo ou do fim do teclado, anda tudo de oitava em oitava até caber
    const maiorPosicao = OITAVAS_TECLADO * 12 - 1;
    const menorPosicao = 0;
    let deslocamento = 0;
    const maisAlta = Math.max(...todas.map(a => a.absoluta));
    const maisBaixa = Math.min(...todas.map(a => a.absoluta));
    if (maisAlta + deslocamento > maiorPosicao) deslocamento -= Math.ceil((maisAlta + deslocamento - maiorPosicao) / 12) * 12;
    if (maisBaixa + deslocamento < menorPosicao) deslocamento += Math.ceil((menorPosicao - (maisBaixa + deslocamento)) / 12) * 12;
    todas.forEach(a => { a.absoluta += deslocamento; });
    return { posicoes: todas, indiceBaixo: ordem[0] };
  }
  // Acorde normal: se passar do fim do teclado, desce de oitava até caber
  const maiorPosicao = OITAVAS_TECLADO * 12 - 1;
  const passou = posicoes[posicoes.length - 1].absoluta - maiorPosicao;
  if (passou > 0) {
    const baixar = Math.ceil(passou / 12) * 12;
    posicoes.forEach(a => { a.absoluta -= baixar; });
  }
  // Mãos: as 5 notas mais agudas ficam na direita (ou todas, se forem 5 ou menos).
  // As que sobram, as mais graves, ficam na esquerda. Nunca alterna direita/esquerda.
  const porAltura = posicoes.slice().sort((x, y) => x.absoluta - y.absoluta);
  const qtdEsquerda = Math.max(0, porAltura.length - MAX_NOTAS_MAO_DIREITA);
  porAltura.forEach((a, k) => { a.mao = k < qtdEsquerda ? "Esquerda" : "Direita"; });
  return { posicoes: posicoes, indiceBaixo: ordem[0] };
}

// Junta as notas de todos os acordes ligados, pra pintar as teclas certas
function notasTecladoDosAcordes() {
  const notas = new Map();      // posição da tecla -> nome da nota
  const raizes = new Map();     // posição da tecla -> cor da bolinha do baixo
  const cores = new Map();      // posição da tecla -> cores dos acordes que usam ela
  const maos = new Map();       // posição da tecla -> mão (só no "acorde completo")
  const acordes = acordesDoCampo(campoAtual);
  escolhidos.forEach(numAcorde => {
    const partes = acordes[numAcorde].partes.map((p, i) => ({ nome: acordes[numAcorde].notas[i], grau: p.grau }));
    const pegada = pegadaTeclado(numAcorde, partes);
    pegada.posicoes.forEach(({ indice, absoluta, mao }) => {
      const nome = partes[indice].nome;
      notas.set(absoluta, nome);
      if (!cores.has(absoluta)) cores.set(absoluta, []);
      if (!cores.get(absoluta).includes(CORES_ACORDES[numAcorde])) cores.get(absoluta).push(CORES_ACORDES[numAcorde]);
      if (indice === pegada.indiceBaixo) raizes.set(absoluta, CORES_BOLINHAS[numAcorde]);
      if (mao) maos.set(absoluta, mao);
    });
  });
  return { notas, raizes, cores, maos };
}

/* ============================================================
   12. DESENHAR O BRAÇO (violão e baixo)
   "funcaoCelula" diz o que vai em cada casa (ou nada).
   ============================================================ */
function desenharBraco(funcaoCelula) {
  tabela.replaceChildren();

  // Linha de cima: o número de cada casa (0 a 24)
  const linhaCabecalho = document.createElement("tr");
  const cantoTh = document.createElement("th");
  cantoTh.textContent = "Corda \\ Casa";
  linhaCabecalho.appendChild(cantoTh);
  for (let f = 0; f <= NUM_CASAS; f++) {
    const th = document.createElement("th");
    th.textContent = f;
    if (casasAzuis.includes(f)) {
      th.classList.add("casa-marcada-azul");
    } else if (casasMarcadas.includes(f)) {
      th.classList.add("casa-marcada");
    }
    linhaCabecalho.appendChild(th);
  }
  tabela.appendChild(linhaCabecalho);

  const afinacao = instrumentoAtual.afinacao;
  // Pra escrever a oitava de cada casa (C4 = dó do meio do piano)
  const afinacaoNums = afinacao.map(numeroDaNota);
  const meiosTonsDaCorda = [0];
  for (let j = 1; j < afinacaoNums.length; j++) meiosTonsDaCorda.push(meiosTonsDaCorda[j - 1] + ((afinacaoNums[j] - afinacaoNums[j - 1] + 12) % 12));
  const oitavaCordaSolta = instrumentoAtual.oitavaCordaSolta || 2;
  // Uma linha pra cada corda
  afinacao.forEach((notaSolta, i) => {
    const linha = document.createElement("tr");

    // Nome da corda, na esquerda (ex.: "6ª (E)")
    const celulaNome = document.createElement("td");
    celulaNome.textContent = (afinacao.length - i) + "ª (" + notaSolta + ")";
    celulaNome.className = "nome-corda";
    linha.appendChild(celulaNome);

    // Uma casa depois da outra
    for (let f = 0; f <= NUM_CASAS; f++) {
      const td = document.createElement("td");
      td.dataset.corda = i;
      td.dataset.casa = f;
      const c = funcaoCelula(i, f);

      if (c) {
        // Pinta o fundo com a cor do acorde (ou das cores, se forem vários)
        if (c.cores) {
          const n = c.cores.length;
          const faixas = c.cores.map((cor, k) => cor + " " + (k * 100 / n) + "% " + ((k + 1) * 100 / n) + "%");
          td.style.background = n === 1 ? c.cores[0] : "linear-gradient(90deg, " + faixas.join(", ") + ")";
        }
        if (c.ehRaiz) {
          // Nota principal: bolinha branca
          const bolinha = document.createElement("span");
          bolinha.className = "bolinha-nota";
          bolinha.textContent = c.nome;
          bolinha.style.background = c.corBolinha || CORES_BOLINHAS[0];
          td.appendChild(bolinha);
        } else {
          td.textContent = c.nome;
          td.classList.add("nota-" + c.nome[0]);
        }
        // Escreve o número da oitava no cantinho da casa
        const midiCasa = (oitavaCordaSolta + 1) * 12 + afinacaoNums[0] + meiosTonsDaCorda[i] + f;
        const elOitava = document.createElement("span");
        elOitava.className = "oitava-na-casa";
        elOitava.textContent = Math.floor(midiCasa / 12) - 1;
        td.appendChild(elOitava);
      }

      if (f === 0) td.classList.add("casa0");
      if (casasAzuis.includes(f)) {
        td.classList.add("casa-marcada-azul");
      } else if (casasMarcadas.includes(f)) {
        td.classList.add("casa-marcada");
      }

      linha.appendChild(td);
    }

    tabela.appendChild(linha);
  });
}

/* ============================================================
   13. DESENHAR O TECLADO
   ============================================================ */

// Cor da letra da nota nas teclas brancas (mais escura pra dar pra ler)
const COR_NOTA_ESCURA = { A: "#c03030", B: "#c06a20", C: "#a38a00", D: "#4a9a1a", E: "#1f9a74", F: "#1f78b0", G: "#8a40c8" };

// Pinta a tecla com uma cor (ou com várias cores lado a lado)
function pintarTecla(elTecla, cores) {
  const n = cores.length;
  if (n === 1) { elTecla.style.background = cores[0]; return; }
  const faixas = cores.map((cor, k) => cor + " " + (k * 100 / n) + "% " + ((k + 1) * 100 / n) + "%");
  elTecla.style.background = "linear-gradient(90deg, " + faixas.join(", ") + ")";
}

// Escreve o número da oitava no alto da tecla branca
function adicionarRotuloOitava(elTecla, ehPreta, oitava, sobreCor) {
  if (ehPreta || oitava === undefined) return;
  const rotulo = document.createElement("span");
  rotulo.className = "rotulo-oitava" + (sobreCor ? " sobre-cor" : "");
  rotulo.textContent = oitava;
  elTecla.appendChild(rotulo);
}

// Escreve a mão (Esquerda ou Direita) de pé na tecla
function adicionarRotuloMao(elTecla, mao) {
  const rotulo = document.createElement("span");
  rotulo.className = "rotulo-mao" + (mao === "Direita" ? " mao-direita" : "");
  rotulo.textContent = mao;
  elTecla.appendChild(rotulo);
}

// Põe dentro da tecla o que ela precisa mostrar: cor de fundo, nome da nota, bolinha, mão e oitava
function montarConteudoTecla(elTecla, num, notasMapa, raizes, coresAcordes, ehPreta, absoluta, oitava, maos) {
  // Quando "absoluta" não vem, a tecla é identificada só pelo número da nota
  const idPintura = absoluta === undefined ? num : absoluta;
  const pintada = coresAcordes && coresAcordes.get(idPintura);
  if (pintada) pintarTecla(elTecla, pintada);
  const idBusca = absoluta === undefined ? num : idPintura;
  if (!notasMapa.has(idBusca)) return;
  if (coresAcordes && !pintada) return;
  const nome = notasMapa.get(idBusca);
  const letraMao = maos && maos.get(idPintura);
  if (raizes.has(idPintura)) {
    // Nota principal: bolinha
    const bolinha = document.createElement("span");
    bolinha.className = "bolinha fundamental";
    bolinha.style.background = raizes.get(idPintura);
    bolinha.textContent = nome;
    elTecla.appendChild(bolinha);
    if (letraMao) adicionarRotuloMao(elTecla, letraMao);
    adicionarRotuloOitava(elTecla, ehPreta, oitava, !!pintada);
  } else {
    // Outra nota: só o nome
    const texto = document.createElement("span");
    texto.className = "nota-tecla";
    if (pintada || ehPreta) texto.classList.add("nota-" + nome[0]);
    else texto.style.color = COR_NOTA_ESCURA[nome[0]];
    texto.textContent = nome;
    elTecla.appendChild(texto);
    if (letraMao) adicionarRotuloMao(elTecla, letraMao);
    adicionarRotuloOitava(elTecla, ehPreta, oitava, !!pintada);
  }
}

// Desenha o teclado inteiro, oitava por oitava
function desenharTeclado(notasMapa, raizes, coresAcordes, usarAbsoluta, maos) {
  caixaTeclado.replaceChildren();

  const teclado = document.createElement("div");
  teclado.className = "teclado";

  for (let o = 0; o < OITAVAS_TECLADO; o++) {
    // Teclas brancas
    NUMS_BRANCAS.forEach((num, i) => {
      const tecla = document.createElement("div");
      tecla.className = "tecla-branca";
      tecla.style.left = ((o * 7 + i) * LARGURA_BRANCA_PCT) + "%";
      tecla.style.width = LARGURA_BRANCA_PCT + "%";
      tecla.dataset.absoluta = num + o * 12;
      montarConteudoTecla(tecla, num, notasMapa, raizes, coresAcordes, false, usarAbsoluta ? num + o * 12 : undefined, 2 + o, maos);
      teclado.appendChild(tecla);
    });
    // Teclas pretas (ficam por cima, entre as brancas)
    TECLAS_PRETAS.forEach(([posicao, num]) => {
      const tecla = document.createElement("div");
      tecla.className = "tecla-preta";
      tecla.style.left = (((o * 7 + posicao + 1) * LARGURA_BRANCA_PCT) - LARGURA_PRETA_PCT / 2) + "%";
      tecla.style.width = LARGURA_PRETA_PCT + "%";
      tecla.dataset.absoluta = num + o * 12;
      montarConteudoTecla(tecla, num, notasMapa, raizes, coresAcordes, true, usarAbsoluta ? num + o * 12 : undefined, undefined, maos);
      teclado.appendChild(tecla);
    });
  }

  caixaTeclado.appendChild(teclado);
}

/* ============================================================
   14. DESENHAR A TELA
   Decide o que mostrar (braço ou teclado, notas ou acordes)
   e atualiza o título e a linha de informação.
   ============================================================ */
function desenhar() {
  const ehTeclado = instrumentoAtual.tipo === "teclado";
  tabela.hidden = ehTeclado;
  caixaTeclado.hidden = !ehTeclado;

  if (ehTeclado) {
    if (modoAcordes) {
      const p = notasTecladoDosAcordes();
      desenharTeclado(p.notas, p.raizes, p.cores, true, p.maos);
    } else {
      desenharTeclado(notasDoCampo(), new Map([[numeroDaNota(campoAtual.notas[0]), CORES_BOLINHAS[0]]]), null);
    }
    elTitulo.textContent = "Teclado — " + OITAVAS_TECLADO + " oitavas (C a B)";
  } else {
    if (modoAcordes) {
      const celulas = celulasDosAcordes();
      desenharBraco((s, f) => celulas.get(s + "," + f) || null);
    } else {
      const notas = notasDoCampo();
      const numTonica = numeroDaNota(campoAtual.notas[0]);
      const afinacao = instrumentoAtual.afinacao.map(numeroDaNota);
      desenharBraco((s, f) => {
        const num = (afinacao[s] + f) % 12;
        return notas.has(num) ? { nome: notas.get(num), ehRaiz: num === numTonica, corBolinha: CORES_BOLINHAS[0] } : null;
      });
    }
    elTitulo.textContent = instrumentoAtual.nome + " — Casa 0 a " + NUM_CASAS + " (afinação padrão)";
  }

  // Linha do lado do título
  if (modoAcordes) {
    // Mostra o nome e as notas de cada acorde ligado
    const acordes = acordesDoCampo(campoAtual);
    const lista = [...escolhidos].sort((x, y) => x - y).map(i => acordes[i].nome + " - " + acordes[i].notas.join(" "));
    infoCampo.replaceChildren();
    if (!lista.length) {
      infoCampo.textContent = "Nenhum acorde escolhido. Clique nos acordes acima.";
    } else {
      lista.forEach((txt, k) => {
        if (k) {
          infoCampo.append(" ");
          const separador = document.createElement("span");
          separador.className = "separador";
          separador.textContent = "|";
          infoCampo.appendChild(separador);
          infoCampo.append(" ");
        }
        const s = document.createElement("span");
        s.className = "info-acorde";
        s.textContent = txt;
        infoCampo.appendChild(s);
      });
    }
  } else {
    infoCampo.textContent = "Campo de " + tituloDoCampo(campoAtual) + ": " + campoAtual.notas.join("  ");
  }
}

/* ============================================================
   15. ESCOLHAS DO TOPO (instrumento e botões dos campos)
   ============================================================ */

// Enche a caixinha de instrumentos
function preencherInstrumentos() {
  instrumentos.forEach(inst => {
    const opcao = document.createElement("option");
    opcao.value = inst.id;
    opcao.textContent = inst.nome;
    escolhaInstrumento.appendChild(opcao);
  });
}

// Desenha os botões dos campos. Quando dois campos têm o mesmo som
// (ex.: C# e Db), os dois botões ficam colados, lado a lado.
function desenharBotoesCampo() {
  caixaBotoesCampo.replaceChildren();
  // Junta os campos que têm o mesmo som
  const grupos = [];
  camposDoTipo(tipoAtual).forEach(campo => {
    const num = numeroDaNota(campo.notas[0]);
    const ultimo = grupos[grupos.length - 1];
    if (ultimo && ultimo.num === num) ultimo.campos.push(campo);
    else grupos.push({ num: num, campos: [campo] });
  });
  grupos.forEach(grupo => {
    // Se tem dois, coloca numa caixinha única. Se tem um, fica solto.
    let destino = caixaBotoesCampo;
    if (grupo.campos.length > 1) {
      destino = document.createElement("div");
      destino.className = "par-campo";
      caixaBotoesCampo.appendChild(destino);
    }
    grupo.campos.forEach(campo => {
      const botao = document.createElement("button");
      botao.type = "button";
      botao.className = "botao-campo";
      botao.textContent = campo.notas[0];
      botao.setAttribute("aria-pressed", campo === campoAtual ? "true" : "false");
      botao.setAttribute("aria-label", "Campo de " + tituloDoCampo(campo));
      botao.addEventListener("click", () => {
        campoAtual = campo;
        atualizarCampo();
      });
      destino.appendChild(botao);
    });
  });
}

/* ============================================================
   16. A BARRA DOS ACORDES
   Desenha as 7 colunas (uma pra cada acorde), cada uma com:
   botão do acorde, "Ouvir", setas de formato, setas de inversão,
   extensões e o nome da inversão.
   ============================================================ */
function desenharBarraAcordes() {
  barraAcordes.replaceChildren();
  // Fora do "Modo acordes" a barra fica vazia
  if (!modoAcordes) return;

  acordesDoCampo(campoAtual).forEach((acorde, i) => {
    const coluna = document.createElement("div");
    coluna.className = "coluna-acorde" + (escolhidos.has(i) ? "" : " coluna-acorde-inativa");

    // --- Botão grande do acorde: liga e desliga ---
    const botao = document.createElement("button");
    botao.type = "button";
    botao.className = "botao-acorde";
    botao.style.setProperty("--cor", CORES_ACORDES[i]);
    botao.setAttribute("aria-pressed", escolhidos.has(i) ? "true" : "false");

    const elGrau = document.createElement("span");
    elGrau.className = "grau";
    permitirQuebraDeLinha(elGrau, acorde.romano);

    const ehTecladoAgora = instrumentoAtual.tipo === "teclado";
    const partes = ehTecladoAgora ? acorde.partes.map((p, k) => ({ nome: acorde.notas[k], grau: p.grau })) : notasParaTocar(acorde);
    const nomeMostrado = escolhidos.has(i) ? nomeAcordeExibido(i, acorde, partes) : acorde.nome;

    const elNome = document.createElement("span");
    elNome.className = "nome-acorde";
    permitirQuebraDeLinha(elNome, nomeMostrado);
    botao.title = acorde.romano + "  " + nomeMostrado + "  —  " + acorde.notas.join(" ");

    botao.appendChild(elGrau);
    botao.appendChild(elNome);
    botao.addEventListener("click", () => {
      if (escolhidos.has(i)) escolhidos.delete(i); else escolhidos.add(i);
      atualizar();
    });
    coluna.appendChild(botao);

    // --- Botão "Ouvir": toca o acorde e acende as notas na tela ---
    const botaoOuvir = document.createElement("button");
    botaoOuvir.type = "button";
    botaoOuvir.className = "botao-ouvir";
    botaoOuvir.textContent = "▶ Ouvir";
    botaoOuvir.setAttribute("aria-label", "Tocar o acorde " + nomeMostrado);
    botaoOuvir.disabled = !escolhidos.has(i);
    botaoOuvir.addEventListener("click", (evento) => {
      evento.stopPropagation();
      // Refaz a lista na hora do clique: sempre reflete o que está na tela agora
      const vozes = vozesDoAcorde(i, partes);
      let ultimoEl = null;
      const apagarTudo = () => vozes.forEach(v => v.el && v.el.classList.remove("nota-brilhando"));
      tocarSomDoAcorde(vozes,
        // A cada nota que toca, acende ela e apaga a anterior
        (k) => {
          if (ultimoEl) ultimoEl.classList.remove("nota-brilhando");
          const el = vozes[k].el;
          if (el) el.classList.add("nota-brilhando");
          ultimoEl = el;
        },
        // Quando as notas tocam juntas, acende todas. No fim, apaga tudo.
        (fim) => {
          if (fim) { apagarTudo(); return; }
          if (ultimoEl) ultimoEl.classList.remove("nota-brilhando");
          vozes.forEach(v => v.el && v.el.classList.add("nota-brilhando"));
        }
      );
    });
    coluna.appendChild(botaoOuvir);

    // --- Setas < > : trocam o formato (outro lugar do braço, ou outra oitava no teclado) ---
    const setas = document.createElement("div");
    setas.className = "setas";
    const qtdFormas = ehTecladoAgora ? quantidadeFormasTeclado() : listaDePegadas(i, partes).length;
    [["<", -1, "anterior"], [">", 1, "próxima"]].forEach(([txt, direcao, dica]) => {
      const botaoSeta = document.createElement("button");
      botaoSeta.type = "button";
      botaoSeta.className = "botao-seta";
      botaoSeta.textContent = txt;
      botaoSeta.setAttribute("aria-label", "Forma " + dica + " do acorde " + acorde.nome);
      botaoSeta.disabled = !escolhidos.has(i) || qtdFormas < 2;
      botaoSeta.addEventListener("click", () => {
        indiceForma[i] = (indiceForma[i] + direcao + qtdFormas) % qtdFormas;
        atualizar();
      });
      setas.appendChild(botaoSeta);
    });
    coluna.appendChild(setas);

    // --- Botões − + : trocam a inversão (qual nota fica no baixo) ---
    const inversao = document.createElement("div");
    inversao.className = "setas";
    [["−", -1, "anterior"], ["+", 1, "próxima"]].forEach(([txt, direcao, dica]) => {
      const botaoInversao = document.createElement("button");
      botaoInversao.type = "button";
      botaoInversao.className = "botao-seta";
      botaoInversao.textContent = txt;
      botaoInversao.setAttribute("aria-label", "Inversão " + dica + " do acorde " + acorde.nome);
      const ehTeclado = instrumentoAtual.tipo === "teclado";
      const opcoesInv = ehTeclado ? opcoesInversaoTeclado(partes) : opcoesInversao(partes);
      botaoInversao.disabled = !escolhidos.has(i) || opcoesInv.length < 2;
      botaoInversao.addEventListener("click", () => {
        const m = opcoesInv.length;
        let posicao = opcoesInv.findIndex(o => o.grau === indiceInversao[i]);
        if (posicao < 0) posicao = 0;
        indiceInversao[i] = opcoesInv[(posicao + direcao + m) % m].grau;
        if (!ehTeclado) {
          // Procura o formato novo que fica mais perto de onde a mão estava
          const atuais = listaDePegadas(i, partes);
          const casaAtual = atuais.length ? atuais[indiceForma[i] % atuais.length].casaMinima : 0;
          const novas = listaDePegadas(i, partes);
          let melhorPos = 0, menorDistancia = Infinity;
          novas.forEach((v, k) => { const d = Math.abs(v.casaMinima - casaAtual); if (d < menorDistancia) { menorDistancia = d; melhorPos = k; } });
          indiceForma[i] = melhorPos;
        }
        atualizar();
      });
      inversao.appendChild(botaoInversao);
    });
    coluna.appendChild(inversao);

    // --- Extensões: caixinha pra ligar e nome embaixo pra ver os jeitos ---
    const caixa = document.createElement("div");
    caixa.className = "caixa-extensoes";
    const marcadores = document.createElement("div");
    marcadores.className = "marcadores-extensoes";
    // O instrumento não deixa passar do número de cordas
    const maxNotas = instrumentoAtual.afinacao ? instrumentoAtual.afinacao.length : Infinity;
    const qtdAtivas = EXTENSOES.filter(d => opcoes[i][d.chave]).length + 1;
    EXTENSOES.forEach(def => {
      const chave = def.chave;
      const envolucro = document.createElement("div");
      envolucro.className = "extensao";
      const caixaMarcar = document.createElement("input");
      caixaMarcar.type = "checkbox";
      caixaMarcar.checked = opcoes[i][chave];
      caixaMarcar.disabled = !escolhidos.has(i) || (!opcoes[i][chave] && qtdAtivas >= maxNotas);
      caixaMarcar.setAttribute("aria-label", def.rotulo + " do acorde " + acorde.nome);
      caixaMarcar.addEventListener("change", () => {
        opcoes[i][chave] = caixaMarcar.checked;
        extensaoEmFoco[i] = caixaMarcar.checked ? chave : (extensaoEmFoco[i] === chave ? null : extensaoEmFoco[i]);
        indiceForma[i] = 0;
        indiceInversao[i] = "R";
        atualizar();
      });
      const botaoNome = document.createElement("button");
      botaoNome.type = "button";
      botaoNome.textContent = def.rotulo;
      botaoNome.disabled = !escolhidos.has(i) || !opcoes[i][chave];
      botaoNome.setAttribute("aria-label", "Variações da " + def.rotulo + " do acorde " + acorde.nome);
      // Nome amarelo = a pessoa mudou o jeito normal
      if (opcoes[i][chave] && acorde.alterada[chave]) botaoNome.classList.add("alterada");
      // Contorno azul = é essa que está sendo mexida
      if (extensaoEmFoco[i] === chave && opcoes[i][chave]) botaoNome.classList.add("foco");
      botaoNome.addEventListener("click", () => { extensaoEmFoco[i] = chave; desenharBarraAcordes(); });
      envolucro.append(caixaMarcar, botaoNome);
      marcadores.appendChild(envolucro);
    });
    caixa.appendChild(marcadores);

    // Caixinha com as escolhas da extensão em foco (ex.: b9, 9, #9)
    const variacoes = document.createElement("div");
    variacoes.className = "variacoes";
    const emFoco = extensaoEmFoco[i];
    if (emFoco && opcoes[i][emFoco] && escolhidos.has(i)) {
      const def = EXTENSOES.find(x => x.chave === emFoco);
      const atual = variacaoEscolhida[i][emFoco] || acorde.natural[emFoco];
      def.variacoes.forEach(v => {
        const rotulo = document.createElement("label");
        // O jeito normal do campo ganha um pontinho azul
        if (v === acorde.natural[emFoco]) rotulo.className = "natural";
        const botaoRadio = document.createElement("input");
        botaoRadio.type = "radio";
        botaoRadio.name = "variacao-" + i;
        botaoRadio.checked = atual === v;
        botaoRadio.addEventListener("change", () => {
          // Voltar pro normal = apagar a escolha
          if (v === acorde.natural[emFoco]) delete variacaoEscolhida[i][emFoco]; else variacaoEscolhida[i][emFoco] = v;
          indiceForma[i] = 0;
          indiceInversao[i] = "R";
          atualizar();
        });
        const texto = document.createElement("span");
        texto.textContent = v;
        rotulo.append(botaoRadio, texto);
        variacoes.appendChild(rotulo);
      });
    } else {
      variacoes.hidden = true;
    }
    caixa.appendChild(variacoes);
    coluna.appendChild(caixa);

    // --- Nome da inversão que está valendo (Fundamental, 1ª inversão...) ---
    const rotuloInversao = document.createElement("div");
    rotuloInversao.className = "rotulo-inversao";
    rotuloInversao.textContent = escolhidos.has(i) ? nomeDaInversao(instrumentoAtual.tipo === "teclado" ? (opcoesInversaoTeclado(partes).find(o => o.grau === indiceInversao[i]) || opcoesInversaoTeclado(partes)[0] || { grau: indiceInversao[i] }).grau : grauDoBaixo(i, partes)) : "";
    rotuloInversao.style.minHeight = "14px";
    coluna.appendChild(rotuloInversao);
    barraAcordes.appendChild(coluna);
  });
}

/* ============================================================
   17. ATUALIZAR TUDO
   ============================================================ */

// Redesenha a tela toda depois de qualquer mudança
function atualizar() {
  botaoModo.setAttribute("aria-pressed", String(modoAcordes));
  document.getElementById("chave-completo").checked = acordeCompleto;
  // A chave "Acorde Completo" e o textinho de ajuda só aparecem no "Modo acordes"
  document.querySelector(".caixa-chave-completo").style.display = modoAcordes ? "flex" : "none";
  document.getElementById("legenda-extensoes").style.display = modoAcordes ? "block" : "none";
  desenharBotoesCampo();
  desenharBarraAcordes();
  desenhar();
}

// Quando muda o campo: volta os formatos e inversões pro começo
function atualizarCampo() {
  indiceForma = new Array(7).fill(0);
  indiceInversao = new Array(7).fill("R");
  atualizar();
}

/* ============================================================
   18. QUANDO A PESSOA CLICA OU ESCOLHE ALGO
   ============================================================ */

// Botão "Modo acordes"
botaoModo.addEventListener("click", () => { modoAcordes = !modoAcordes; atualizar(); });

// Chave "Acorde Completo"
const chaveCompleto = document.getElementById("chave-completo");
chaveCompleto.addEventListener("change", () => { acordeCompleto = chaveCompleto.checked; atualizar(); });

// Escolher outro instrumento
escolhaInstrumento.addEventListener("change", () => {
  instrumentoAtual = instrumentos.find(i => i.id === escolhaInstrumento.value);
  indiceForma = new Array(7).fill(0);
  indiceInversao = new Array(7).fill("R");
  atualizar();
});

// Escolher entre maior e menor (mantém a mesma nota de início, se der)
escolhaTipo.addEventListener("change", () => {
  const raizAntiga = campoAtual.notas[0];
  tipoAtual = escolhaTipo.value;
  campoAtual = acharCampoParecido(raizAntiga);
  atualizarCampo();
});

/* ============================================================
   19. COMEÇO
   Prepara a caixinha de instrumentos e desenha a tela pela primeira vez.
   ============================================================ */
preencherInstrumentos();
atualizarCampo();
</script>
